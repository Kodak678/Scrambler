apply plugin: 'com.android.application'

android {
    aaptOptions {
        noCompress 'tflite', 'json'
    }

    compileSdk 36

    defaultConfig {
        applicationId "rkr.simplekeyboard.inputmethod"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 137
        versionName "5.41"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'rkr.simplekeyboard.inputmethod'
}

dependencies {
implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.12.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.crypto.tink:tink-android:1.13.0'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.6'

    // ZXing for Generation (Core only for minimal footprint)
    implementation 'com.google.zxing:core:3.5.1'

    // Google ML Kit for Scanning (Bundled version)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // CameraX for the camera feed
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation 'androidx.camera:camera-core:1.6.0'
    implementation "com.google.guava:guava:31.1-android"
    implementation 'ai.djl.huggingface:tokenizers:0.23.0'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
